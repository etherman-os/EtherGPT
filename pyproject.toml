[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ethergpt-host"
version = "0.1.1"
description = "Connect ChatGPT Web to one computer and all of its MCP servers through one OpenAI Secure MCP Tunnel"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Berkay" }]
dependencies = [
  "fastmcp>=3.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
ethergpt = "ethergpt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ethergpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
